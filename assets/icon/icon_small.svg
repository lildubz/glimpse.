<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#171310"/>
      <stop offset="100%" stop-color="#0C0A08"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F0C976"/>
      <stop offset="100%" stop-color="#C8973E"/>
    </linearGradient>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <text x="360" y="600"
        font-family="Georgia, 'Times New Roman', serif"
        font-weight="900"
        font-size="560"
        text-anchor="middle"
        fill="url(#gold)">g</text>

  <!-- blinking text cursor -->
  <rect x="640" y="330" width="46" height="330" rx="10" fill="url(#gold)"/>
